<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django App</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Navbar */
        .navbar {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

        /* Hero Section */
        .hero {
            padding: 60px;
            text-align: center;
            background-color: #ff6b6b;
            color: white;
        }

        .hero h1 {
            margin: 0;
            font-size: 40px;
        }

        .hero p {
            font-size: 18px;
        }

        /* Button */
        .btn {
            background-color: white;
            color: #ff6b6b;
            padding: 10px 20px;
            border: none;
            margin-top: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Cards */
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px;
        }

        .card {
            background: white;
            padding: 20px;
            width: 200px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <h2>My Django App 🚀</h2>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <h1>Welcome to Django</h1>
        <p>Build your first web app step by step</p>
        <button class="btn">Get Started</button>
    </div>

    <!-- Cards Section -->
    <div class="container">
        <div class="card">
            <h3>Fast</h3>
            <p>Django is super fast</p>
        </div>

        <div class="card">
            <h3>Secure</h3>
            <p>Built-in security features</p>
        </div>

        <div class="card">
            <h3>Powerful</h3>
            <p>Perfect for real projects</p>
        </div>
    </div>

</body>
</html>
